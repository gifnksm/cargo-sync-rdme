# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json
profile: pedantic

ignores:
  - rule: superfluous-actions
    uses: dtolnay/rust-toolchain
    reason: >-
      The action centralizes Rust CI setup and compatibility workarounds,
      including retries for transient distribution checksum failures, keeping
      this logic out of individual workflows.
  - rule: [stale-action-refs, ref-version-mismatch]
    uses: dtolnay/rust-toolchain
    allow-unused: true
    reason: >-
      Its only tag, v1, moves, so an intentional SHA pin may no longer have a tag
      or match the v1 comment until Renovate updates it.
