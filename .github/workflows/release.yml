name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Metadata checks and jobs that build or publish release artifacts must not
# restore caches: poisoned tools or dependencies could alter releases or steal
# publishing credentials.
cache-mode: none

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  check-metadata:
    name: Check Cargo metadata
    outputs:
      package_name: ${{ steps.check-metadata.outputs.name }}
      package_version: ${{ steps.check-metadata.outputs.version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Check Cargo package version
        id: check-metadata
        run: |
          name="$(./scripts/print-metadata name)"
          version="$(./scripts/print-metadata version)"
          expected_tag="v$version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Error: Git tag '$GITHUB_REF_NAME' does not match Cargo package version '$version'."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        shell: bash

  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write # Required for codecov-action to upload coverage reports

  audit:
    uses: $/.github/workflows/reusable-audit.yml

  build:
    uses: $/.github/workflows/build-dist.yml

  prepare-release:
    name: Prepare GitHub Release
    needs:
      - check-metadata
      - ci
      - audit
      - build
    permissions:
      contents: write # Allow creating releases and uploading release assets
      id-token: write # Allow generating OIDC tokens for signing release assets
      attestations: write # Allow creating attestations for release assets
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifact-*
          path: target/dist
          merge-multiple: true
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/dist/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/dist/* \
            --generate-notes \
            --verify-tag \
            --draft
        shell: bash

  publish-crate:
    name: Publish crate to crates.io
    needs:
      - check-metadata
      - prepare-release
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ needs.check-metadata.outputs.package_name }}/${{ needs.check-metadata.outputs.package_version }}
    permissions:
      contents: read
      id-token: write # Allow generating OIDC tokens for authenticating with crates.io
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash

  publish-release:
    name: Publish GitHub Release
    needs:
      - publish-crate
    permissions:
      contents: write # Allow publishing the GitHub Release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
        shell: bash
