name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  check-metadata:
    name: Check Cargo metadata
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.check-metadata.outputs.name }}
      package_version: ${{ steps.check-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check Cargo package version
        id: check-metadata
        run: |
          name="$(./scripts/print-metadata name)"
          version="$(./scripts/print-metadata version)"
          expected_tag="v$version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Error: Git tag '$GITHUB_REF_NAME' does not match Cargo package version '$version'."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    uses: $/.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    uses: $/.github/workflows/audit.yml
    permissions:
      contents: read
      issues: write

  build:
    uses: $/.github/workflows/build-dist.yml

  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    needs:
      - check-metadata
      - ci
      - audit
      - build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifact-*
          path: target/dist
          merge-multiple: true
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/dist/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/dist/* \
            --generate-notes \
            --verify-tag \
            --draft

  publish-crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    needs:
      - check-metadata
      - prepare-release
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ needs.check-metadata.outputs.package_name }}/${{ needs.check-metadata.outputs.package_version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - publish-crate
    permissions:
      contents: write
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
