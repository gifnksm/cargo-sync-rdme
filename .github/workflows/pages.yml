name: Deploy Rustdoc to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: jdx/mise-action@v5.2.3
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run pages:build
        shell: bash
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/doc

  deploy:
    name: "Deploy"
    permissions:
      id-token: write # Allow verifying the deployment originates from an appropriate source
      pages: write # Allow deploying to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [build]
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
