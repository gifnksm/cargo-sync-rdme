name: Renovate Post Update

on:
  push:
    branches:
      - "renovate/**"

concurrency:
  group: renovate-post-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.actor == 'renovate[bot]' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  renovate-post-update:
    if: ${{ github.actor == 'renovate[bot]' && !github.event.deleted }}
    name: Renovate Post Update
    environment:
      name: renovate-post-update
      deployment: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run install-toolchains-for-renovate-post-update
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run renovate-post-update
        shell: bash
      - name: Check git status
        id: git-status
        run: |
          status="$(git status --porcelain)"
          untracked="$(grep '^?? ' <<< "${status}" || true)"
          tracked_changes="$(grep -v '^?? ' <<< "${status}" || true)"

          if [[ -n "${untracked}" ]]; then
            echo "Unexpected untracked files were generated by renovate-post-update:" >&2
            echo "${untracked}" >&2
            exit 1
          fi

          if [[ -n "${tracked_changes}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi
        shell: bash
      # Check for concurrent branch updates before committing.
      - name: Check remote branch
        if: ${{ steps.git-status.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [[ "${remote_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Remote branch has changed since workflow started" >&2
            echo "Expected: ${GITHUB_SHA}" >&2
            echo "Actual:   ${remote_sha}" >&2
            exit 1
          fi
        shell: bash
      # Create the app token only after the update steps finish so
      # untrusted dependency code does not run with write credentials.
      # commit-action creates and revokes the short-lived installation token.
      - name: Commit and Push changes
        if: ${{ steps.git-status.outputs.changed == 'true' }}
        uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
        with:
          client_id: ${{ secrets.UPDATE_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
          branch: ${{ github.ref_name }}
          commit_message: "chore: auto format and sync markdowns"
          fail_on_self_push: false
