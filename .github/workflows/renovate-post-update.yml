name: Renovate Post Update

on:
  push:
    branches:
      - "renovate/**"

concurrency:
  group: renovate-post-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.actor == 'renovate[bot]' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  renovate-post-update:
    if: ${{ github.actor == 'renovate[bot]' && !github.event.deleted }}
    name: Renovate Post Update
    environment:
      name: renovate-post-update
      deployment: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run install-toolchains-for-renovate-post-update
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run renovate-post-update
        shell: bash
      - name: Check git status
        id: git-status
        run: |
          status="$(git status --porcelain)"
          untracked="$(grep '^?? ' <<< "${status}" || true)"
          tracked_changes="$(grep -v '^?? ' <<< "${status}" || true)"

          if [[ -n "${untracked}" ]]; then
            echo "Unexpected untracked files were generated by renovate-post-update:" >&2
            echo "${untracked}" >&2
            exit 1
          fi

          if [[ -n "${tracked_changes}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi
        shell: bash
      # Create the app token only after the update steps finish so
      # untrusted dependency code does not run with write credentials,
      # and so the short-lived installation token stays fresh for push.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: ${{ steps.git-status.outputs.changed == 'true' }}
        id: app-token
        with:
          client-id: ${{ secrets.UPDATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit and Push changes
        if: ${{ steps.git-status.outputs.changed == 'true' }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --local user.name "${APP_SLUG}[bot]"
          git config --local user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git add -u
          git commit -m "chore: auto format and sync markdowns"
          git push
        shell: bash
