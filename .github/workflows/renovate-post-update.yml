name: Renovate Post Update

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  renovate-post-update:
    if: github.actor == 'renovate[bot]'
    name: Renovate Post Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: mise run renovate-post-update
        shell: bash
      - name: Check git status
        id: git-status
        run: |
          status="$(git status --porcelain)"
          untracked="$(grep '^?? ' <<< "${status}" || true)"
          tracked_changes="$(grep -v '^?? ' <<< "${status}" || true)"

          if [[ -n "${untracked}" ]]; then
            echo "Unexpected untracked files were generated by renovate-post-update:" >&2
            echo "${untracked}" >&2
            exit 1
          fi

          if [[ -n "${tracked_changes}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi
        shell: bash
      - uses: actions/create-github-app-token@v3
        if: steps.git-status.outputs.changed == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.UPDATE_BOT_APP_ID }}
          private-key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
      - name: Commit and Push changes
        if: steps.git-status.outputs.changed == 'true'
        env:
          APP_ID: ${{ secrets.UPDATE_BOT_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --local user.name "${APP_SLUG}[bot]"
          git config --local user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: auto format and sync markdowns"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"
        shell: bash
