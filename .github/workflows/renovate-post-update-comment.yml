name: Renovate Post Update Comment

# PR comments use github.token without the update Environment's app credentials.
# See renovate-post-update.yml for why updates use push instead of pull_request
# to preserve the Environment's renovate/* deployment branch restriction.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: renovate-post-update-comment-${{ github.workflow }}-${{ github.event.pull_request.number }}
  # Runs may reach this group out of event order. Finish in-flight comment writes;
  # every remaining run reconciles the latest PR state, regardless of its event.
  cancel-in-progress: false

permissions: {}

jobs:
  comment:
    name: Review non-Renovate commits
    if: >-
      ${{ github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'renovate/') }}
    permissions:
      contents: read
      pull-requests: write # Allow posting and removing the review comment
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Read commit metadata through the API; do not execute code from the PR.
      - name: Inspect PR commits
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          if [[ "$(jq -r '.state' <<< "${pr}")" != "open" ]]; then
            echo "PR is no longer open; skipping comment updates."
            exit 0
          fi

          # Renovate PRs are small; checking the first ten commits is sufficient.
          commits="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=10")"
          other_commits="$(jq '[.[] | select(.author.login != "renovate[bot]")]' <<< "${commits}")"
          if jq -e 'length > 0' <<< "${other_commits}" > /dev/null; then
            {
              echo "> [!WARNING]"
              echo "> This PR contains commits from authors other than Renovate."
              echo "> Please review these changes before merging."
              echo
              echo "Commits:"
              echo
              jq -r '.[] | "- [\(.sha[0:7])](\(.html_url)) (\(.author.login // "unknown author"))"' <<< "${other_commits}"
            } > "${RUNNER_TEMP}/renovate-post-update-comment.md"
            echo "needs_review=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs_review=false" >> "${GITHUB_OUTPUT}"
          fi
        shell: bash
      - name: Remove sticky PR comment
        if: ${{ steps.inspect.outputs.needs_review == 'false' }}
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: renovate-post-update
          delete: true
      - name: Leave sticky PR comment
        if: ${{ steps.inspect.outputs.needs_review == 'true' }}
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: renovate-post-update
          # Keep changed review notices at the end of the thread, while repeated
          # runs for the same commit list leave an unchanged comment in place.
          recreate: true
          skip_unchanged: true
          path: ${{ runner.temp }}/renovate-post-update-comment.md
