name: Build Dist

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-dist-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  build-dist:
    name: Build
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        job:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.job.target }}
      - name: Install modern bash on macOS
        if: startsWith(matrix.job.os, 'macos')
        run: |
          brew install bash
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Build
        run: mise run build:dist --target "${{ matrix.job.target }}"
        shell: bash
      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-${{ matrix.job.target }}
          path: target/dist/*

  build-dist-complete:
    needs:
      - build-dist
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Build Dist complete
        run: |
          if ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}; then
            echo "Build Dist succeeded"
          else
            echo "Build Dist failed"
            exit 1
          fi
        shell: bash
