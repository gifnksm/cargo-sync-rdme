name: Build Dist

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-dist-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  build-dist:
    name: Build
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        job:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.job.target }}
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.job.target }}
      - name: Install modern bash on macOS
        if: ${{ startsWith(matrix.job.os, 'macos') }}
        run: |
          brew install bash
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Build
        run: mise run build:dist --target "${TARGET}"
        env:
          TARGET: ${{ matrix.job.target }}
        shell: bash
      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-${{ matrix.job.target }}
          path: target/dist/*
          if-no-files-found: error

  build-dist-complete:
    name: build-dist-complete
    if: ${{ always() }}
    needs:
      - build-dist
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Build Dist complete
        env:
          RESULT: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          if "${RESULT}"; then
            echo "Build Dist succeeded"
          else
            echo "Build Dist failed"
            exit 1
          fi
        shell: bash
