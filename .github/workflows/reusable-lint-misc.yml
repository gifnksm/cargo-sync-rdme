name: "[Reusable] Lint (misc)"

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: "Rust version to use"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  workflow:
    name: Workflow
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:workflow
        shell: bash
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}

  spelling:
    name: Spelling
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:spelling
        shell: bash

  markdown:
    name: Markdown
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - uses: jdx/mise-action@v5.2.3
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run lint:markdown
        shell: bash

  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:editorconfig
        shell: bash

  toml:
    name: TOML
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:toml
        shell: bash

  shell:
    name: Shell Script
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:shell
        shell: bash

  renovate:
    name: Renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run lint:renovate
        shell: bash
