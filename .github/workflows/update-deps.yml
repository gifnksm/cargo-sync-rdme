name: Update Dependencies

on:
  schedule:
    # Runs at 00:00 UTC every Monday
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update-deps-rust:
    name: Update Dependencies (rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: mise run update-deps:rust
        shell: bash
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.UPDATE_BOT_APP_ID }}
          private-key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update dependencies"
          title: "chore: update dependencies"
          body: |
            This PR updates dependencies using:
            - `cargo upgrade --compatible`: Updates semver-compatible direct dependency versions in `Cargo.toml`
            - `cargo update`: Updates `Cargo.lock` with the latest compatible versions (including indirect dependencies)
          branch: update-dependencies
          delete-branch: true
          labels: dependencies
