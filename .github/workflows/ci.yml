name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: "Codecov token for uploading coverage reports"
        required: false
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MISE_CARGO_BINSTALL_ONLY: true
  MISE_LOCKED: true

jobs:
  set-matrix:
    runs-on: ubuntu-26.04
    outputs:
      rust: ${{ steps.set-values.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Set matrix values
        id: set-values
        run: |
          json_array() {
            jq -cnb --args '$ARGS.positional' "$@"
          }

          msrv="$(./scripts/print-metadata msrv)"
          rust="$(json_array stable "${msrv}")"
          echo "rust=${rust}" >> "$GITHUB_OUTPUT"

          jq -nb --argjson rust "${rust}" '{ rust: $rust }'
        shell: bash

  check-rust:
    name: Check (rust)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: ${{ fromJSON(needs.set-matrix.outputs.rust) }}
    uses: $/.github/workflows/reusable-check-rust.yml
    with:
      rust-toolchain: ${{ matrix.rust }}
      run-doc-checks: ${{ matrix.rust == 'stable' }}

  lint-rust:
    name: Lint (rust)
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
    uses: $/.github/workflows/reusable-lint-rust.yml
    with:
      rust-toolchain: ${{ matrix.rust }}

  test-rust:
    name: Test (rust)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: ${{ fromJSON(needs.set-matrix.outputs.rust) }}
    uses: $/.github/workflows/reusable-test-rust.yml
    with:
      rust-toolchain: ${{ matrix.rust }}
      collect-coverage: ${{ matrix.rust == 'stable' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  check-markdown:
    name: Check (markdown)
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run install-toolchains-for-ci-check-markdown
        shell: bash
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run ci:check-markdown
        shell: bash

  check-release:
    name: Check (release)
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: [ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run check:release --skip-ci
        shell: bash

  build-book:
    name: Build (book)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:build-book
        shell: bash

  test-book:
    name: Test (book)
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: [ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run ci:test-book
        shell: bash

  lint-workflow:
    name: Lint (workflow)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-workflow
        shell: bash

  lint-spelling:
    name: Lint (spelling)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-spelling
        shell: bash

  lint-markdown:
    name: Lint (markdown)
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: [ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run ci:lint-markdown
        shell: bash

  lint-editorconfig:
    name: Lint (editorconfig)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-editorconfig
        shell: bash

  lint-toml:
    name: Lint (toml)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-toml
        shell: bash

  lint-shell:
    name: Lint (shell scripts)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-shell
        shell: bash

  lint-renovate:
    name: Lint (renovate)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          github_token: ${{ github.token }}
          persist_github_token: true
      - run: mise run ci:lint-renovate
        shell: bash

  ci-complete:
    needs:
      - set-matrix
      - check-rust
      - lint-rust
      - test-rust
      - check-markdown
      - check-release
      - build-book
      - test-book
      - lint-workflow
      - lint-spelling
      - lint-markdown
      - lint-editorconfig
      - lint-toml
      - lint-shell
      - lint-renovate
    runs-on: ubuntu-26.04
    if: ${{ always() }}
    steps:
      - name: CI complete
        run: |
          if ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}; then
            echo "CI succeeded"
          else
            echo "CI failed"
            exit 1
          fi
        shell: bash
