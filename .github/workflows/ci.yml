name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.set-values.outputs.rust }}
      os: ${{ steps.set-values.outputs.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - name: Set matrix values
        id: set-values
        run: |
          root_package_id="$(cargo metadata --format-version 1 | jq -cr '.resolve.root')"
          root_package="$(cargo metadata --format-version 1 | jq -c --arg pkgid "${root_package_id}" '.packages[] | select(.id == $pkgid)')"
          echo "${root_package}" | jq -c '{ root_package: .name }'

          msrv="$(echo "${root_package}" | jq '.rust_version')"
          rust="$(echo "[\"stable\", ${msrv}]" | jq -c)"
          echo "rust=${rust}" >> "$GITHUB_OUTPUT"

          os="$(echo '["ubuntu-latest", "macos-latest", "windows-latest"]' | jq -c)"
          echo "os=${os}" >> "$GITHUB_OUTPUT"

          jq -n --argjson rust "${rust}" --argjson os "${os}" '{ rust: $rust, os: $os }'
        shell: bash

  format-rust:
    name: Format (Rust)
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:format:rust
        shell: bash

  check-rust:
    name: Check (Rust)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: ${{ fromJSON(needs.set-matrix.outputs.rust) }}
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:check:rust
        shell: bash

  check-rustdoc:
    name: Check (rustdoc)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:check:rustdoc
        shell: bash

  check-unused-deps:
    name: Check (unused dependencies)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:check:unused-deps
        shell: bash

  lint-rust:
    name: Lint (Rust)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:lint:rust
        shell: bash

  test-rust:
    name: Test (Rust)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: ${{ fromJSON(needs.set-matrix.outputs.rust) }}
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:test:rust
        shell: bash

  coverage-rust-test:
    name: Coverage (Rust test)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:coverage:rust-test
        shell: bash
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/codecov-test.json
          fail_ci_if_error: false

  coverage-rust-run:
    name: Coverage (Rust run)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:coverage:rust-run
        shell: bash
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/codecov-run.json
          fail_ci_if_error: false

  release-dry-run:
    name: Release dry run
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run release-dry-run
        shell: bash

  format-toml:
    name: Format (TOML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise run ci:format:toml
        shell: bash

  lint-toml:
    name: Lint (TOML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise run ci:lint:toml
        shell: bash

  lint-workflow:
    name: Lint (workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise run ci:lint:workflow
        shell: bash

  sync-markdown:
    name: Sync (Markdown)
    needs: set-matrix
    strategy:
      fail-fast: true
      matrix:
        rust: [stable]
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:sync:markdown
        shell: bash

  lint-spelling:
    name: Lint (spelling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise run ci:lint:spelling
        shell: bash

  lint-markdown:
    name: Lint (Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise run ci:lint:markdown
        shell: bash

  lint-editorconfig:
    name: Lint (EditorConfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise run ci:lint:editorconfig
        shell: bash

  ci-complete:
    needs:
      - set-matrix
      - format-rust
      - check-rust
      - check-rustdoc
      - check-unused-deps
      - lint-rust
      - test-rust
      - coverage-rust-test
      - coverage-rust-run
      - release-dry-run
      - format-toml
      - lint-toml
      - lint-workflow
      - lint-spelling
      - sync-markdown
      - lint-markdown
      - lint-editorconfig
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: CI complete
        run: |
          if ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}; then
            echo "CI succeeded"
          else
            echo "CI failed"
            exit 1
          fi
        shell: bash
