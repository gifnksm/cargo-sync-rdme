[settings]
lockfile = true
cargo.binstall_quickinstall = true  # cargo-edit binaries are only available via cargo-binstall quickinstall
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]

[tools]
actionlint = "1.7.12"
cargo-binstall = "1.22.0"  # lets mise install cargo:* tools from binaries instead of compiling them
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-release" = "1.1.5"
"cargo:typos-cli" = "1.50.0"
editorconfig-checker = "3.11.2"
"npm:markdownlint-cli" = "0.49.1"
"npm:renovate" = { version = "44.52.1", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
rust = { version = "stable", components = ["llvm-tools"] }
shellcheck = "0.11.0"
shfmt = "3.14.0"
tombi = "1.4.1"

[shell_alias]
editorconfig-checker = "ec"
