[settings]
lockfile = true
# Work around mise install dropping platform-specific lockfile entries in merge mode.
lockfile_mode = "generate"
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]
minimum_release_age = "3d"
cargo.binstall_quickinstall = true

[task_config]
# Use mise's Bash detection to avoid the WSL launcher on Windows.
# https://mise.jdx.dev/troubleshooting.html#shell-bash-c-task-fails-with-command-not-found-from-powershell
shell = "bash -c"

[tools]
"aqua:taiki-e/cargo-llvm-cov" = { version = "0.9.1", lazy = true, lazy_bins = ["cargo-llvm-cov"] }
cargo-binstall = "1.26.1"  # lets mise install cargo:* tools from binaries instead of compiling them
cargo-deny = { version = "0.20.2", lazy = true }
cargo-release = { version = "v1.1.7", lazy = true, lazy_bins = ["cargo-release"], platforms.windows-arm64.asset_pattern = "cargo-release-v{{ version }}-x86_64-pc-windows-msvc.zip" }
"cargo:cargo-docs-rs" = { version = "1.0.4", lazy = true, lazy_bins = ["cargo-docs-rs"] }
editorconfig-checker = { version = "4.0.2", lazy = true, lazy_bins = ["editorconfig-checker"] }
"github:EmbarkStudios/cargo-about" = { version = "0.9.3", lazy = true, lazy_bins = ["cargo-about"] }
"github:bnjbvr/cargo-machete" = { version = "0.9.2", lazy = true, lazy_bins = ["cargo-machete"], platforms.windows-arm64.asset_pattern = "cargo-machete-v{{ version }}-x86_64-pc-windows-msvc.tar.gz" }
"github:rust-secure-code/cargo-auditable" = { version = "0.7.7", lazy = true, lazy_bins = ["cargo-auditable"] }
"github:taiki-e/cargo-hack" = { version = "0.6.45", lazy = true, lazy_bins = ["cargo-hack"] }
jactionlint = { version = "v2.3.0", lazy = true }
mdbook = { version = "0.5.4", lazy = true }
osv-scanner = { version = "2.7.0", lazy = true }
rumdl = { version = "v0.3.0", lazy = true }
shellcheck = { version = "0.11.0", lazy = true }
shfmt = { version = "3.14.1", lazy = true }
tombi = { version = "1.9.7", lazy = true }
typos = { version = "1.51.1", lazy = true }
