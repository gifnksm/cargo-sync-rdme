[pre-release]
run = [
  { task = "sync:markdown --allow-dirty" },
  '''
  {% if env.RELEASE_SKIP_CHECK != 'true' %}
  MISE_TASK_SKIP=check:release mise run ci
  {% else %}
  # pre-release checks skipped
  {% endif %}
  '''
]

["check:release"]
wait_for = ["check:*", "lint:*", "test:*", "build:book"]
run = '''
RELEASE_SKIP_CHECK="true" cargo release patch --allow-branch '*'
'''
