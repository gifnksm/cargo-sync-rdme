["check:rust"]
description = "Run all Rust checks"
depends = ["check:rust:*"]

["lint:rust"]
description = "Run all Rust lints"
depends = ["lint:rust:*"]

[install-nightly-toolchain]
description = "Install Rust nightly toolchain"
run = "rustup toolchain install nightly"

["format:rust"]
description = "Format Rust files"
run = "cargo fmt --all"

["lint:rust:rustfmt"]
description = "Lint Rust formatting"
run = "cargo fmt --all --check"

["check:rust:compile"]
description = "Check Rust compilation across all target groups and exhaustive feature combinations"
env = { CARGO_BUILD_WARNINGS = "deny" }
run = [
  "cargo hack --workspace --feature-powerset check --locked",
  "cargo hack --workspace --feature-powerset check --locked --examples",
  "cargo hack --workspace --feature-powerset check --locked --tests",
  "cargo hack --workspace --feature-powerset check --locked --benches",
  "cargo hack --workspace --feature-powerset check --locked --all-targets",
]

["check:rust:rustdoc"]
description = "Check rustdoc builds across exhaustive feature combinations"
env = { CARGO_BUILD_WARNINGS = "deny" }
run = "cargo hack --workspace --feature-powerset doc --no-deps --locked"

[install-toolchains-for-check-docs-rs]
description = "Install Rust toolchain for docs.rs documentation checks"
depends = ["install-nightly-toolchain"]

["check:rust:docs-rs"]
description = "Check docs.rs-compatible documentation builds"
depends = ["install-toolchains-for-check-docs-rs"]
env = { CARGO_BUILD_WARNINGS = "deny" }
run = "rustup run nightly bash ./scripts/cargo-hack-lib docs-rs --locked"

["lint:rust:unused-deps"]
description = "Check for unused dependencies"
run = "cargo machete"

["lint:rust:clippy"]
description = "Lint Rust across all target groups and exhaustive feature combinations"
env = { CARGO_BUILD_WARNINGS = "deny" }
run = [
  "cargo hack --workspace --feature-powerset clippy --locked",
  "cargo hack --workspace --feature-powerset clippy --locked --examples",
  "cargo hack --workspace --feature-powerset clippy --locked --tests",
  "cargo hack --workspace --feature-powerset clippy --locked --benches",
  "cargo hack --workspace --feature-powerset clippy --locked --all-targets",
]

["lint:rust:policy"]
description = "Lint Rust policy (bans, licenses, sources)"
run = "cargo deny --locked check bans licenses sources"

["test:rust"]
description = "Run Rust tests across exhaustive feature combinations"
depends = ["install-toolchains-for-rust-test"]
run = "cargo hack --workspace --feature-powerset test --locked"

[install-toolchains-for-rust-test]
description = "Install Rust toolchains for test"
depends = ["install-nightly-toolchain"]
run = [
  # toolchains used in `tests/intra_link.rs` and `tests/toolchain_version.rs`
  "rustup toolchain install stable",
  # toolchains used in `tests/toolchain_version.rs`
  "rustup toolchain install beta",
  "rustup toolchain install 1.90.0",
]

["coverage:rust"]
description = "Run Rust tests with coverage"
usage = '''
flag "--codecov" help="Export coverage data in \"Codecov Custom Coverage\" format"
flag "--output-path <output>" help="Specify a file to write coverage data into."
'''
depends = ["install-toolchains-for-rust-test"]
raw_args = true
quiet = true
# Internal note: intentionally uses --all-features (not --feature-powerset).
# Reason: powerset-style repeated runs can overwrite codecov output.
run = '''
#!/usr/bin/env bash
set -euxo pipefail
cargo llvm-cov --workspace --all-features --locked "$@" test
'''

[update-ui-test-snapshots]
description = "Update UI test snapshots"
depends = ["install-toolchains-for-rust-test"]
env = { SNAPSHOTS = "overwrite" }
run = "cargo test --test ui"
