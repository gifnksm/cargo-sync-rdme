["install-toolchains-for-sync-markdown"]
description = "Install Rust toolchain for synchronizing markdown"
depends = ["install-nightly-toolchain"]

["sync:markdown"]
description = "Synchronize Markdown files with Rust doc comments"
usage = '''
flag "--check" help="Run cargo-sync-rdme in check mode"
flag "--allow-dirty" help="Sync Markdown files even if the target file is dirty"
flag "--locked" help="Assert that `Cargo.lock` will remain unchanged."
'''
depends = ["install-toolchains-for-sync-markdown"]
quiet = true
run = '''
#!/usr/bin/env bash
set -euxo pipefail

declare -a cargo_args=()
declare -a sync_rdme_args=()

if [[ "${usage_check:-}" == "true" ]]; then
    sync_rdme_args+=("--check")
fi
if [[ "${usage_allow_dirty:-}" == "true" ]]; then
    sync_rdme_args+=("--allow-dirty")
fi
if [[ "${usage_locked:-}" == "true" ]]; then
    cargo_args+=("--locked")
    sync_rdme_args+=("--locked")
fi

cargo run "${cargo_args[@]}" -- "${sync_rdme_args[@]}" --workspace
'''

["format:markdown"]
description = "Format Markdown files"
usage = '''
flag "--check" help="Run rumdl in check mode"
'''
raw_args = true
quiet = true
run = '''
#!/usr/bin/env bash
set -euxo pipefail
rumdl format "$@"
'''

["lint:markdown"]
description = "Lint Markdown files"
run = "rumdl check"
