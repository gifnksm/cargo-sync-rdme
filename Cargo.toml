[package]
name = "cargo-sync-rdme"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
description = "Cargo subcommand to synchronize README with crate documentation"
repository.workspace = true
license.workspace = true
keywords = ["cargo", "documentation", "readme", "rustdoc", "subcommand"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[package.metadata.cargo-sync-rdme]
extra-targets = "./docs/configuration.md"

[package.metadata.cargo-sync-rdme.badge]
style = "flat-square"
badges = {
  maintenance = true,
  license = { link = "#license" },
  crates-io = true,
  rust-version = true,
  github-actions = { workflows = ["ci.yml"] },
  codecov = true,
}
badges-maintenance = { maintenance = true }
badges-license = { license = true }
badges-crates-io = { crates-io = true }
badges-docs-rs = { docs-rs = true }
badges-rust-version = { rust-version = true }
badges-github-actions = { github-actions = true }
badges-codecov = { codecov = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[workspace]
members = ["crates/test-helper", "examples/lib"]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
repository = "https://github.com/gifnksm/cargo-sync-rdme"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
clap-cargo = { version = "0.19.0" }
clap_complete = "4.6.9"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.3"
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
console = "0.16.4"
indoc = "2.0.7"
miette = { version = "7.6.0", features = ["fancy"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
pulldown-cmark-to-cmark = "22.0.1"
rstest = "0.26.1"
rustdoc-types = "0.61.0"
scraper = { version = "0.27.0", default-features = false }
self_cell = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
similar = { version = "3.2.0", features = ["inline", "unicode"] }
similar-asserts = "2.0.0"
snafu = "0.9.2"
snapbox = { version = "1.2.2", features = ["dir", "term-svg"] }
strum = { version = "0.28.0", features = ["derive"] }
supports-color = "3.0.2"
tempfile = "3.27.0"
test-helper = { path = "crates/test-helper" }
toml = { version = "1.1.4", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicase = "2.9.0"
url = "2.5.8"
vcs-modify-guard = { version = "0.1.1", default-features = false }
void = "1.0.2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Restriction group
allow_attributes = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
doc_paragraphs_missing_punctuation = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
map_err_ignore = "warn"
self_named_module_files = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_self_imports = "warn"
unused_trait_names = "warn"
verbose_file_reads = "warn"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
keyword_idents = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
missing_unsafe_on_extern = "warn"
redundant_imports = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_attr_outside_unsafe = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
unescaped_backticks = "warn"

[dependencies]
cargo_metadata.workspace = true
clap.workspace = true
clap-cargo.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
clap_mangen.workspace = true
clap-verbosity-flag.workspace = true
console.workspace = true
miette.workspace = true
pulldown-cmark.workspace = true
pulldown-cmark-to-cmark.workspace = true
rustdoc-types.workspace = true
self_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
similar.workspace = true
snafu.workspace = true
strum.workspace = true
supports-color.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicase.workspace = true
url.workspace = true
vcs-modify-guard.workspace = true
void.workspace = true

[dev-dependencies]
indoc.workspace = true
rstest.workspace = true
similar-asserts.workspace = true
snapbox.workspace = true
test-helper.workspace = true

[build-dependencies]

[badges]
maintenance = { status = "actively-developed" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["vcs-git"]
vcs-git = ["vcs-modify-guard/git-default"]

[lints]
workspace = true

[profile.release]
strip = true
